<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>正在处理</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,#f4f8fa,#e8eff4);font-family:-apple-system,"Noto Sans SC","PingFang SC",sans-serif;color:#3d5566;display:flex;align-items:center;justify-content:center;padding:26px}
.box{width:100%;max-width:330px;text-align:center}
h1{margin:0 0 6px;font-size:17px;font-weight:600;letter-spacing:1px}
p.sub{margin:0 0 26px;font-size:12.5px;color:#7f97a6}
.bar{height:9px;border-radius:99px;background:#dbe6ee;overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#7fc7dd,#4aa6c4);transition:width .5s linear}
.pct{margin-top:12px;font-size:13px;color:#5c7c8e;letter-spacing:1px;font-variant-numeric:tabular-nums}
.tip{margin-top:22px;font-size:12px;color:#93a9b6;line-height:1.9;min-height:40px}
.over{display:none;margin-top:22px;font-size:12px;color:#9aaeb9;line-height:1.9}
.over.on{display:block}
</style>
</head>
<body>
<div class="box">
  <h1>正在处理</h1>
  <p class="sub">请稍候，不要关闭这一页</p>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="pct" id="pct">0%</div>
  <div class="tip" id="tip">正在准备…</div>
  <div class="over" id="over">
    其实早就好了。<br>这页是洛汐做的，就当逗你玩。
  </div>
</div>

<script>
(function(){
  var fill=document.getElementById('fill'), pct=document.getElementById('pct'),
      tip=document.getElementById('tip'), over=document.getElementById('over');
  var v=0, waited=0;
  var tips=['正在准备…','正在读取…','正在整理…','快好了…','就差一点…','再等一下下…','马上就好…'];

  var t=setInterval(function(){
    var step;
    if(v<70) step=Math.random()*4+1.2;
    else if(v<93) step=Math.random()*1.1;
    else if(v<98.6) step=Math.random()*0.22;
    else step=0.04;
    v=Math.min(99,v+step);
    fill.style.width=v+'%';
    pct.textContent=(v<99?v.toFixed(0):'99')+'%';
    waited++;
    if(waited%14===0){
      tip.textContent=tips[Math.floor(Math.random()*tips.length)];
    }
    if(v>60 && waited===70){
      tip.textContent='这东西有点大，再给我一点时间';
    }
    if(v>=98.9){
      clearInterval(t);
      setTimeout(function(){
        tip.textContent='';
        over.classList.add('on');
      },6000);
    }
  },480);
})();
</script>
</body>
</html>
