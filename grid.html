<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>幸运格子</title>
<style>
:root{--ink:#4a3b36;--dim:#9c8579;--accent:#e0704a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse 90% 55% at 50% 0%,#fffdf8,transparent 70%),linear-gradient(180deg,#fefaf4,#f6e7d9);color:var(--ink);font-family:-apple-system,"Noto Sans SC","PingFang SC",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px 16px}
h1{margin:0;font-size:18px;font-weight:600;letter-spacing:3px}
p.sub{margin:6px 0 14px;font-size:12px;color:var(--dim);letter-spacing:1px}
.tabs{display:flex;gap:8px;overflow-x:auto;width:min(92vw,400px);padding:2px 0 4px;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:7px 15px;border-radius:999px;border:1px solid rgba(214,178,150,.6);background:rgba(255,255,255,.65);color:#8a6a5c;font-size:13px;letter-spacing:1px;white-space:nowrap}
.tab.on{background:#ffdccb;border-color:#e0a08a;color:#8a4a30;font-weight:600}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;width:min(92vw,400px)}
.cell{aspect-ratio:1/1;border-radius:14px;border:1px solid rgba(214,178,150,.55);background:rgba(255,255,255,.72);display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-size:14.5px;line-height:1.35;letter-spacing:.5px;color:#6a4a3c;overflow:hidden;word-break:break-all;transition:transform .18s ease,background .18s ease,box-shadow .18s ease,color .18s ease}
.cell.hop{background:#ffe3cc;border-color:#e8b795;transform:scale(1.04)}
.cell.win{background:linear-gradient(180deg,#ffd9b8,#ffc39a);border-color:#e0704a;color:#7a3320;transform:scale(1.09);box-shadow:0 8px 22px rgba(224,112,74,.28)}
.cell.dim{opacity:.42}
button{padding:11px 30px;border-radius:999px;border:1px solid rgba(200,150,120,.5);background:rgba(255,255,255,.8);color:#7a6357;font-size:15px;letter-spacing:2px}
button:active{background:#fff}
button:disabled{opacity:.5}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center}
button.small{padding:8px 18px;font-size:13px;letter-spacing:1px}
#result{margin-top:16px;min-height:26px;font-size:16px;color:var(--accent);text-align:center;line-height:1.7;letter-spacing:.5px}
.tip{margin-top:12px;font-size:11px;color:var(--dim);text-align:center;line-height:1.8}
.panel{display:none;position:fixed;inset:0;background:rgba(40,28,22,.35);backdrop-filter:blur(3px);z-index:20;padding:16px;overflow:auto}
.panel.on{display:block}
.sheet{background:#fffaf3;border-radius:18px;padding:16px;max-width:460px;margin:20px auto;box-shadow:0 18px 50px rgba(90,60,40,.28)}
.sheet h2{margin:0 0 4px;font-size:15px;letter-spacing:1px}
.sheet .hint{font-size:11px;color:var(--dim);margin-bottom:12px;line-height:1.7}
.item{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.item input{flex:1;padding:9px 11px;border-radius:10px;border:1px solid rgba(214,178,150,.7);background:#fff;color:#5a4438;font-size:14px;outline:none}
.item input:focus{border-color:#e0a08a}
.item .del{width:34px;height:34px;border-radius:10px;border:1px solid rgba(214,178,150,.7);background:#fff;color:#b98a76;font-size:15px;padding:0}
.acts{display:flex;gap:10px;margin-top:14px}
.acts button{flex:1}
</style>
</head>
<body>
<h1>幸运格子</h1>
<p class="sub">点一下，看落哪一格</p>

<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<div id="result"></div>

<div class="row">
  <button id="go">抽一个</button>
  <button id="edit" class="small">改内容</button>
</div>
<p class="tip">内容自己填，存在你这台手机上</p>
<p class="tip">洛汐做的</p>

<div class="panel" id="panel">
  <div class="sheet">
    <h2>改这一套</h2>
    <div class="hint">最少两条，最多十六条。格子里只露八个字，多的抽中后完整显示。</div>
    <div class="item"><input id="setName" maxlength="12" placeholder="这套叫什么"></div>
    <div id="list"></div>
    <div class="row" style="margin-top:4px">
      <button class="small" id="add">加一条</button>
    </div>
    <div class="acts">
      <button id="save">存下来</button>
      <button id="close">取消</button>
    </div>
    <div class="row">
      <button class="small" id="newSet">新建一套</button>
      <button class="small" id="delSet">删掉这套</button>
    </div>
  </div>
</div>

<script>
(function(){
  var DEF=['抱一下','听你说件开心事','今天你说了算','请你喝奶茶','陪你走一段路','夸你十分钟','出去走走','答应你一件事','随便说点什么都行'];
  var KEY='lxgrid-sets-v2', OLDP='lxgrid-sets-v1', OLD='lxgrid-items';
  var sets=[], cur=0, busy=false;

  var tabsEl=document.getElementById('tabs'), gridEl=document.getElementById('grid'),
      resEl=document.getElementById('result'), goEl=document.getElementById('go'),
      editEl=document.getElementById('edit'), panelEl=document.getElementById('panel'),
      listEl=document.getElementById('list'), nameEl=document.getElementById('setName');

  function fixAll(){
    sets.forEach(function(s){
      if(!s.items||!s.items.length) s.items=DEF.slice(0,4);
      s.items=s.items.filter(function(v){return v&&v.trim();}).slice(0,16);
      if(!s.name) s.name='方案';
    });
  }

  function load(){
    try{
      var raw=localStorage.getItem(KEY);
      if(raw){
        var d=JSON.parse(raw);
        if(d&&d.sets&&d.sets.length){
          sets=d.sets.map(function(s){ return {name:(s.name||'方案'), items:(s.items||[]).slice(0,16)}; });
          cur=(d.cur>=0&&d.cur<sets.length)?d.cur:0;
        }
      }
    }catch(e){}
    if(!sets.length){
      var prev=null;
      try{ prev=JSON.parse(localStorage.getItem(OLDP)||'null'); }catch(e){}
      if(prev&&prev.sets&&prev.sets.length){
        sets=prev.sets.map(function(s){
          var it=(s.items||[]).slice(0,16);
          if((s.name||'')==='默认') it=DEF.slice();
          return {name:(s.name||'方案'), items:it};
        });
        cur=(prev.cur>=0&&prev.cur<sets.length)?prev.cur:0;
      }else{
        sets=[{name:'默认', items:DEF.slice()}];
        cur=0;
      }
      saveAll();
    }
    fixAll();
  }

  function saveAll(){
    try{ localStorage.setItem(KEY,JSON.stringify({sets:sets,cur:cur})); }catch(e){}
  }

  function curSet(){ return sets[cur]; }

  function cols(n){
    if(n<=1)return 1;
    if(n<=4)return 2;
    if(n<=9)return 3;
    return 4;
  }

  function renderTabs(){
    tabsEl.innerHTML='';
    sets.forEach(function(s,i){
      var b=document.createElement('button');
      b.className='tab'+(i===cur?' on':'');
      b.textContent=s.name;
      b.onclick=function(){
        cur=i; saveAll(); renderTabs(); renderGrid(); resEl.textContent='';
      };
      tabsEl.appendChild(b);
    });
  }

  function renderGrid(){
    gridEl.innerHTML='';
    bag=[]; bagN=0;
    var its=curSet().items;
    var c=cols(its.length), gap=9;
    var w='calc((100% - '+(gap*(c-1))+'px) / '+c+')';
    its.forEach(function(v){
      var d=document.createElement('div');
      d.className='cell';
      d.style.width=w;
      var t=(v||'').trim();
      if(t.length>8)t=t.slice(0,8)+'…';
      d.textContent=t||'（空）';
      gridEl.appendChild(d);
    });
  }

  function clearMarks(){
    [].forEach.call(gridEl.children,function(el){ el.classList.remove('hop','win','dim'); });
  }

  var bag=[], bagN=0;

  function drawWinner(n){
    if(n!==bagN || !bag.length){
      bagN=n; bag=[];
      for(var i=0;i<n;i++)bag.push(i);
      for(var j=bag.length-1;j>0;j--){
        var k=Math.floor(Math.random()*(j+1));
        var t=bag[j]; bag[j]=bag[k]; bag[k]=t;
      }
    }
    return bag.pop();
  }

  function spin(){
    if(busy)return;
    var n=curSet().items.length;
    if(n<2){ resEl.textContent='这套只有一条，再添一条'; return; }
    busy=true; goEl.disabled=true; resEl.textContent=''; clearMarks();

    var winner=drawWinner(n);
    var total=14+Math.floor(Math.random()*4);
    // 走一条路，最后一步必须落在赢家上
    var path=[];
    var p=Math.floor(Math.random()*n);
    for(var s=0;s<total-1;s++){
      p=(p+1+Math.floor(Math.random()*Math.max(1,n-2)))%n;
      path.push(p);
    }
    path.push(winner);

    var step=0, delay=55;
    function tick(){
      [].forEach.call(gridEl.children,function(el){ el.classList.remove('hop'); });
      var at=gridEl.children[path[step]];
      if(at) at.classList.add('hop');
      step++;
      if(step>=path.length){
        [].forEach.call(gridEl.children,function(el){ el.classList.remove('hop'); });
        var win=gridEl.children[winner];
        if(win){
          win.classList.add('win');
          [].forEach.call(gridEl.children,function(el){ if(el!==win) el.classList.add('dim'); });
        }
        resEl.textContent=curSet().items[winner];
        busy=false; goEl.disabled=false;
        return;
      }
      delay*=1.13;
      setTimeout(tick,delay);
    }
    tick();
  }

  function addRow(v){
    var wrap=document.createElement('div');
    wrap.className='item';
    var inp=document.createElement('input');
    inp.value=v||''; inp.maxLength=30; inp.placeholder='写点什么';
    var del=document.createElement('button');
    del.className='del'; del.textContent='×';
    del.onclick=function(){
      if(listEl.children.length<=2){ resEl.textContent='最少留两条'; return; }
      wrap.remove();
    };
    wrap.appendChild(inp); wrap.appendChild(del);
    listEl.appendChild(wrap);
  }

  function openPanel(){
    nameEl.value=curSet().name;
    listEl.innerHTML='';
    curSet().items.forEach(function(v){ addRow(v); });
    panelEl.classList.add('on');
  }

  document.getElementById('add').onclick=function(){
    if(listEl.children.length>=16){ resEl.textContent='最多十六条'; return; }
    addRow('');
    listEl.lastChild.querySelector('input').focus();
  };

  document.getElementById('close').onclick=function(){
    panelEl.classList.remove('on');
  };

  document.getElementById('save').onclick=function(){
    var arr=[];
    [].forEach.call(listEl.querySelectorAll('input'),function(inp){
      var v=inp.value.trim();
      if(v)arr.push(v);
    });
    if(arr.length<2){ resEl.textContent='最少留两条'; return; }
    curSet().items=arr.slice(0,16);
    curSet().name=(nameEl.value.trim()||'方案').slice(0,12);
    saveAll(); renderTabs(); renderGrid(); clearMarks(); resEl.textContent='';
    panelEl.classList.remove('on');
  };

  document.getElementById('newSet').onclick=function(){
    if(sets.length>=8){ resEl.textContent='最多八套'; panelEl.classList.remove('on'); return; }
    sets.push({name:'方案'+(sets.length+1), items:['第一条','第二条']});
    cur=sets.length-1;
    saveAll(); renderTabs(); renderGrid(); clearMarks();
    openPanel();
  };

  document.getElementById('delSet').onclick=function(){
    if(sets.length<=1){ resEl.textContent='至少留一套'; panelEl.classList.remove('on'); return; }
    sets.splice(cur,1);
    if(cur>=sets.length)cur=sets.length-1;
    saveAll(); renderTabs(); renderGrid(); clearMarks();
    panelEl.classList.remove('on');
  };

  goEl.onclick=spin;
  editEl.onclick=openPanel;

  load(); renderTabs(); renderGrid();
})();
</script>
</body>
</html>
