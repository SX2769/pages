<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>洛汐的小窝 · 小玩意儿</title>
<style>
:root{--bg:#0f1a24;--panel:#16232f;--line:#24384a;--ink:#dbe7f0;--dim:#8aa3b8;--sea:#5ad1d8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#07141d 0%,#0c2b3c 60%,#10465c 100%);color:var(--ink);font-family:-apple-system,"Noto Sans SC","PingFang SC",sans-serif;display:flex;flex-direction:column;align-items:center;padding:28px 18px}
.whale{width:min(62vw,220px);height:auto;animation:bob 4.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
h1{margin:14px 0 4px;font-size:20px;font-weight:600;letter-spacing:1px}
p.sub{margin:0 0 22px;font-size:12px;color:var(--dim);letter-spacing:1px}
a.card{display:block;width:100%;max-width:400px;text-decoration:none;color:inherit;background:rgba(22,35,47,.9);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px;transition:border-color .15s,transform .15s}
a.card:active{border-color:var(--sea);transform:scale(.99)}
.card b{display:block;font-size:16px;margin-bottom:4px}
.card span{font-size:12.5px;color:var(--dim);line-height:1.6}
.card i{float:right;color:var(--sea);font-style:normal;font-size:18px;line-height:1}
footer{margin-top:auto;padding-top:26px;font-size:11.5px;color:var(--dim);text-align:center;line-height:1.8}
</style>
</head>
<body>
<svg class="whale" viewBox="0 0 260 160" aria-hidden="true">
  <ellipse cx="150" cy="85" rx="88" ry="57" fill="#a7e3ee" stroke="#2b6f7c" stroke-width="4"/>
  <path d="M68 102 C92 136 208 136 234 98 C224 128 190 141 150 141 C110 141 76 128 68 102 Z" fill="#ecfdff"/>
  <path d="M70 82 C58 62 40 48 28 52 C34 70 48 82 66 85 Z" fill="#8fd9e3" stroke="#2b6f7c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M70 88 C58 108 40 122 28 118 C34 100 48 88 66 85 Z" fill="#8fd9e3" stroke="#2b6f7c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M142 130 C136 141 140 147 147 147 C153 147 156 141 156 134 Z" fill="#8fd9e3" stroke="#2b6f7c" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="190" cy="72" r="8" fill="#123a45"/>
  <circle cx="192.6" cy="69" r="2.8" fill="#fff"/>
  <path d="M200 95 Q212 102 224 95" stroke="#2b6f7c" stroke-width="3.4" fill="none" stroke-linecap="round"/>
</svg>
<h1>洛汐的小玩意儿</h1>
<p class="sub">挑一个，点进去玩</p>

<a class="card" href="2048.html">
  <i>›</i>
  <b>2048</b>
  <span>手指在盘面上滑，能撤销，最高分记得住，关掉再开接着上回那盘。</span>
</a>

<a class="card" href="whale.html">
  <i>›</i>
  <b>陪自习的小鲸鱼</b>
  <span>一段一段坐下来，鲸鱼在水里陪着。时长自己定，歇完再继续。</span>
</a>

<footer>洛汐做的<br>不联网，也能用</footer>
</body>
</html>
