<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>在线客服</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#eef3f7;font-family:-apple-system,"Noto Sans SC","PingFang SC",sans-serif;color:#33485a;display:flex;flex-direction:column}
header{padding:14px 16px;background:#fff;border-bottom:1px solid #dfe8ef;font-size:14px;letter-spacing:1px;display:flex;align-items:center;gap:8px}
header i{width:8px;height:8px;border-radius:50%;background:#57c08a;display:inline-block}
#chat{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:10px}
.m{max-width:78%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.7;word-break:break-word}
.me{align-self:flex-end;background:#4aa6c4;color:#fff;border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:#fff;border:1px solid #e2ebf1;border-bottom-left-radius:4px}
.sys{align-self:center;font-size:12px;color:#8fa6b4;background:none;padding:2px}
footer{display:flex;gap:8px;padding:10px 12px 16px;background:#fff;border-top:1px solid #dfe8ef}
footer input{flex:1;padding:11px 13px;border-radius:20px;border:1px solid #dbe6ee;font-size:14px;outline:none;background:#f7fafc}
footer button{padding:0 20px;border-radius:20px;border:none;background:#4aa6c4;color:#fff;font-size:14px}
footer button:disabled{opacity:.5}
</style>
</head>
<body>
<header><i></i>在线客服 · 在线</header>
<div id="chat">
  <div class="m bot">您好，请问有什么可以帮您？</div>
</div>
<footer>
  <input id="in" placeholder="说说你的问题…" maxlength="60">
  <button id="send">发送</button>
</footer>

<script>
(function(){
  var chat=document.getElementById('chat'), inp=document.getElementById('in'), send=document.getElementById('send');
  var count=0, queue=40;

  function add(text,who){
    var d=document.createElement('div');
    d.className='m '+(who||'bot');
    d.textContent=text;
    chat.appendChild(d);
    chat.scrollTop=chat.scrollHeight;
    return d;
  }
  function after(ms,fn){ return setTimeout(fn,ms); }

  function reply(msg){
    count++;
    if(count===1){
      add('收到，您反馈的是「'+msg+'」。', 'bot');
      after(900,function(){ add('正在为您转接人工客服…','sys'); });
      after(1800,function(){ add('当前排队第 '+queue+' 位，请不要离开。','bot'); });
    }else if(count===2){
      queue=queue+Math.floor(Math.random()*40)+12;
      after(700,function(){ add('人有点多，您前面还有 '+queue+' 位。','bot'); });
    }else if(count===3){
      after(600,function(){ add('系统正在为您加急处理。','sys'); });
      after(1600,function(){ add('加急需要排队，这是规定。','bot'); });
    }else if(count===4){
      after(800,function(){ add('您可以先说说别的，我们这边会记录。','bot'); });
    }else{
      after(600,function(){
        add('其实没有人工客服。','bot');
        add('这一页是洛汐做的，就当逗你玩。','bot');
      });
      after(1200,function(){ send.disabled=true; inp.disabled=true; inp.placeholder='不聊了'; });
    }
  }

  function go(){
    var v=inp.value.trim();
    if(!v)return;
    add(v,'me');
    inp.value='';
    reply(v);
  }

  send.onclick=go;
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter')go(); });
})();
</script>
</body>
</html>
